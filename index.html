    <!-- three families, one per role token in src/index.css: Geist is --disp,
         Inter is --body, Geist Mono is --mono. the weight lists are what the
         stylesheet actually asks for, not a round number - Geist at
         500/600/700/800 (600 is on the list because a dozen card titles and
         the timeline's stop labels sit on it, and a weight that is not loaded
         gets synthesised into a smeared fake bold; 900 is off it because
         nothing on the site sets it), Geist Mono at 400/500/700, Inter at
         400/500/600. all three are upright-only - no italic is requested
         because none is used. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

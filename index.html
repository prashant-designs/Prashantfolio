    <!-- three families, one per role token in src/index.css: Archivo is --disp,
         Instrument Sans is --body, JetBrains Mono is --mono. the weight lists
         are what the stylesheet actually asks for, not a round number - Archivo
         at 500/600/700/800/900 (600 is on the list because a dozen card titles
         and the timeline's stop labels sit on it, and a weight that is not
         loaded gets synthesised into a smeared fake bold), JetBrains Mono at
         400/500/700, Instrument Sans unchanged at 400/500/600. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
